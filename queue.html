<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue in javaScript</title>
</head>

<body>
    <h1>Queue in javaScript</h1>
    <p>Concpet is work first in first out (FIFO)</p>

    <input type="text" id="el">
    <button  onclick="enQueue()">Add element</button>
    <button  onclick="deQueue()">Remove element</button>
    <button onclick="display()">Dispaly</button>
    <button onclick="front()">Get front element</button>
    <button onclick="rear()">Get Rear element</button>
</body>
<script>
    let Queue = [];
    let currentSize = Queue.length;
    let maxSize = 5;

    function enQueue() {
        if (currentSize >= maxSize) {
            alert("Queue is full...")
        }
        Queue[currentSize] = document.getElementById('el').value;
        document.getElementById('el').value = '';
        currentSize++;
    }
    function display() {
        console.log(Queue)
    };

    function deQueue() {
        if (!isEmpty()) {
            for (i = 0; i < Queue.length; i++) {
                Queue[i] = Queue[i + 1]
            };
            currentSize--;
            Queue.length = currentSize;
        } else {
            alert('Queue is already empty')
        }

    }

    // check queue value front
    function front() {
        if (!isEmpty()) {
            console.log(Queue[0])
        } else {
            alert('Queue is already empty')
        }

    }

    // check queue value Rear
    function rear() {
        if (!isEmpty()) {
            console.log(Queue[currentSize - 1])
        } else {
            alert('Queue is already empty')
        }

    }

    // common function currentSize > 0
    function isEmpty(){
        if(currentSize<=0){
            return true
        }else{
            return false;
        }
    }
</script>

</html>
