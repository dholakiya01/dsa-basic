    function selectionSort_M2(items) {
        let midId;
        for (let i = 0; i < data.length; i++) {
            midId = i;
            for (j = i + 1; j < data.length; j++) {
                if (data[j] > data[midId]) {
                    midId = j;

            };
            let temp = data[midId];
            data[midId] = data[i];
            data[i] = temp;
        }
    };
