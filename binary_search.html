    <title>Binary Itrative Search in javaScript</title>

<body>
    <h1>Binary Itrative Search in javaScript</h1>
</body>
<script>
    let data = [5, 7, 8, 10, 51, 62, 78];
    let find = 62;
    let start = 0;
    let end = data.length - 1;
    let position = undefined;

    while (start <= end) {
        let mid = Math.floor((start + end) / 2)
        if (data[mid] === find) {
            position = mid;
            break;
        } else if (data[mid] < find) {
            start = mid + 1;
        } else { 
            end = mid - 1;
        }
    };
    console.log(position)
</script>
