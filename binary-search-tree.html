    <title>Binary search tree</title>

<body>
    <h1>Binary search tree</h1>
    <script>

        class Node {
            constructor(value) {
                this.value = value;
                this.right = null;
                this.left = null;
            }
        }
        class BSTree {
            constructor(val) {
                this.root = null;
            }

            // Check Value exists ..
            istreeEmpty() {
                return this.root === null;
            };

            // Create tree ..
            makeTree(val) {
                let newNode = new Node(val)
                if (this.root === null) {
                    this.root = newNode;
                } else {
                    this.insertNode(this.root, newNode)
                }
            }

            // Insert data left & right ..
            insertNode(root, newNode) {
                if (root.value > newNode.value) {
                    if (root.left === null) {
                        root.left = newNode
                    } else {
                        this.insertNode(root.left, newNode)
                    }
                } else {
                    if (root.right === null) {
                        root.right = newNode
                    } else {
                        this.insertNode(root.right, newNode)
                    }
                }
            };

            // Search ..
            search(root, val) {
                if (root === null) {
                    return false;
                } else if (root.value === val) {
                    return true
                } else if (root.value > val) {
                    return this.search(root.left, val)
                } else {
                    return this.search(root.right, val)
                }
            };

            // Preorder Traversing..
            preOrder(root) {
                if (root) {
                    console.warn("Preorder:", root.value)
                    this.preOrder(root.left) // recursion
                    this.preOrder(root.right) // recursion
                }
            }

            // inOrder Traversing..
            inOrder(root) {
                if (root) {
                    this.inOrder(root.left) // recursion
                    console.warn("inOrder:", root.value)
                    this.inOrder(root.right) // recursion
                }
            };

            // postOrder Traversing..
            postOrder(root) {
                if (root) {
                    this.postOrder(root.left) // recursion
                    this.postOrder(root.right) // recursion
                    console.warn("postOrder:", root.value)
                }
            }

            // Bredth first search traversing ..
            bfsTraversing() {
                let queqe = [];
                queqe.push(this.root)
                while (queqe.length) {
                    let current = queqe.shift();
                    if (current.left) {
                        queqe.push(current.left)
                    }
                    if (current.right) {
                        queqe.push(current.right)
                    };
                    console.warn(`Breath first search tree :${current.value}`)
                }
            };

            // Min value ..
            minvalue(root) {
                if (!root.left) {
                    return root.value
                } else {
                    return this.minvalue(root.left)
                }
            }

            // Max value ..
            maxvalue(root) {
                if (!root.right) {
                    return root.value
                } else {
                    return this.maxvalue(root.right)
                }
            };

            // remove node ..
            removeNode(value) {
                this.root = this.deleteNode(this.root, value)
            };

            deleteNode(root,value) {
                if (root === null) {
                    return null;
                }
                if (value < root.value) {
                    root.left = this.deleteNode(root.left, value);
                }else if(value > root.value){
                    root.right = this.deleteNode(root.right, value);
                }else{
                    if(!root.left && !root.right){
                        return null
                    }else if(!root.left){
                        return root.right
                    }else if(!root.right){
                        return root.left
                    };
                    root.value = this.minvalue(root.right)
                    root.right = this.deleteNode(root.right,root.value)
                }
                return root;
            }

        }
        let bst = new BSTree();
        bst.makeTree(20);
        bst.makeTree(10);
        bst.makeTree(5);
        bst.makeTree(50);
        bst.makeTree(30);

        // bst.search(bst.root, 30);
        console.warn(bst.search(bst.root, 30), "Search..")

        bst.preOrder(bst.root);
        bst.inOrder(bst.root);
        bst.postOrder(bst.root);
        bst.removeNode(30)
        bst.bfsTraversing();
        console.error(bst.minvalue(bst.root), "bst.minvalue(bst.root)..")
        console.error(bst.maxvalue(bst.root), "bst.maxnvalue(bst.root)..")
        // console.warn(bst.istreeEmpty(), "root node...")
        console.warn(bst, "binary search...") // Check BST
    </script>
</body>
