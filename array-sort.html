<script>
    // let data = [40,30,12,25];
    let data = [20, 84, 65, 98, 78, 87];

    for (let i = 0; i < data.length; i++) {
        for (j = 0; j < data.length; j++) {
            console.log(data,"step")
            // Data swaping....
            if (data[j] > data[j + 1]) {
                let temp = data[j];
                data[j] = data[j + 1];
                data[j+1] = temp;
            }
        }
    };
    // console.log(data,"data.......")
</script>
