<body>
    <input type="number" id="element">
    <button onclick="getelement()">Get element</button>

<script>

    // }

    // accessing

    function getelement() {
        const res = document.getElementById("element").value;
        if (res > data.length - 1) {
            alert("Please enter small value")
        } else {
            alert(`value is ${data[res]} * 2 = ${data[res] * 2}`)
        }
    }
</script>
