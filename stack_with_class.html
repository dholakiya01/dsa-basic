<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stack with class In javaScript</title>
</head>

<body>
    <h1>Stack with class In javaScript</h1>
</body>
<script>
    // when call class first call constructor
    class Stack {
        item = [];
        currentSize;
        maxSize;
        constructor(size) {
            this.currentSize = this.item.length;
            this.maxSize = size;
        }
        push(newval) {
            if (this.currentSize >= this.maxSize) {
                alert("Stack is full.")
            } else {
                this.item[this.currentSize] = newval;
                this.currentSize++;
            }
        }
        pop() { 
            if(this.currentSize > 0){
                this.currentSize--;
                this.item.length = this.currentSize;
            }else{
                alert('Stack is empty');
            }
        }
        display() {
            console.warn(this.item, "stored item")
        }
    }
    str1 = new Stack(5);
    str1.push(20); 
    str1.display(); 
</script>

</html>
