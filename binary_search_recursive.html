    <title>Binary Search Recursive approch in javaScript</title>

<body>
    <h1>Binary Search Recursive approch in javaScript</h1>
</body>
<script>
    let data = [10, 20, 30, 32, 48, 77];
    let start = 0;
    let end = data.length - 1;
    let find = 32;
    let position = undefined;

    function recursiveBinary(data, start, end) {
        let mid = Math.floor((start + end) / 2);
        if (data[mid] === find) {
            position = mid;
            return true;
        } else if (data[mid] < find) {
            recursiveBinary(data, mid + 1, end);
        } else {
            recursiveBinary(data, start, mid - 1)
        }

    };
    recursiveBinary(data, start, end);
    console.warn(position,'postion');
</script>
