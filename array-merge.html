</body>
<script>
    let data1 = [10, 80, 20, 60, 40, 64, 70, 45, 16, 34];
    let data2 = [12, 84, 40, 64, 54, 65, 75, 24, 30, 52];
    let merge = [];

    for (let i = 0; i < data1.length; i++) {
        merge[i] = data1[i];
    };
    for (let i = 0; i < data2.length; i++) {
        merge[data1.length + i] = data2[i]
    }
    console.log(merge);
</script>
