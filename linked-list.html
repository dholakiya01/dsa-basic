<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linked List</title>
</head>

<body>
    <h1>Linked List..</h1>
    <script>

        // Basic Linked list
        class List {
            constructor(data) {
                this.head = {
                    value: data,
                    next: null
                };
                this.tail = this.head;
                this.tail.value = 500;
                this.size = 1;
                console.log(this.head, "heade...");
            };

            // Add More..
            appendNode(nodeData) {
                let newData = {
                    value: nodeData,
                    next: null
                };
                this.tail.next = newData;
                this.tail = newData;
                this.size += 1
            };

            // Traversing ..
            traversing() {
                let counter = 0;
                let currentNode = this.head;
                while (counter < this.size) {
                    currentNode = currentNode.next;
                    console.log(currentNode, "currentNode..");
                    counter++;
                    // console.log(counter,"counter run");
                }
            };

            // Remove Node ..
            removeNode(index) {
                let counter = 1;
                let lead = this.head
                if (index === 1) {
                    this.head = this.head.next;
                } else {
                    while (counter < index - 1) {
                        lead = lead.next;
                        counter++;
                    };
                    let nextNode = lead.next.next;
                    lead.next =nextNode;
                    console.warn(lead)
                }
            };

            // Insert Node any index ..
            insertNode(index,value){
                let counter = 1;
                let currentNode = this.head;
                while(counter > index){
                    counter++;
                    currentNode= currentNode.next
                };
                let nextNode = currentNode.next;
                currentNode.next = {
                    value : value,
                    next:nextNode
                }
            };

            // Search Node ..
            searchNode(data){
                let result = undefined;
                let lead = this.head;
                let loop = true;
                while(loop){
                    lead = lead.next;
                    loop = !!lead;
                    if(loop && lead.value === data){
                        loop = false;
                        result = lead;
                    }
                }
                console.warn(result,"result..");
            }

        };
        const list = new List(200);
        list.appendNode(400)
        list.appendNode(600)
        list.appendNode(700)
        list.appendNode(800);

        // Get Data..
        list.traversing();

        // Remove Data
        list.removeNode(1);

        // Insert Data any index..
        list.insertNode(2,234)

        // Search Node ..
        list.searchNode(234)

        console.log(list,"list...");
    </script>
</body>
