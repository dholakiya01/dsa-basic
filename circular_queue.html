<body>
    <h1>Circular Queue In javaScript</h1>
</body>
<script>
    class Queue {
        constructor(size) {
            this.max = size;
            this.items = new Array(size);
            this.currentSize = 0;
            this.rear = -1
            this.front = -1
        };
        enQueue(val) {
            if (this.currentSize != this.max) {
                if (this.rear == this.max - 1) {
                    this.rear = 0;
                } else {
                    this.rear++;
                }
                this.items[this.rear] = val;
                this.currentSize++;
                if ((this.front == -1)) {
                    this.front = this.rear;
                }
            }
        };

        deQueue(val) {
            if (this.currentSize != 0) {
                this.items[this.front] = null;
                    if (this.front == this.max - 1) {
                        this.front = 0;
                    } else {
                        this.front++;
                    };
                    this.currentSize--;
                } else {
                    this.front = -1;
                    this.rear = -1;
                    alert('queue is full')
                }
            } 
    };
    const que = new Queue(5)
</script>
